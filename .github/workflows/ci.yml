name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o archscore ./cmd/archscore
      - run: ./archscore -root . -config archscore.json
      - run: ./archscore discover -root . -min-clusters 2 -max-clusters 5
